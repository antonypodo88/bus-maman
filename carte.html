<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte bus</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui; background: #111; color: #eee; }
  .haut { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000; display: flex; gap: 8px; }
  .haut button { flex: 1; background: #222; color: #eee; border: 2px solid #444; border-radius: 14px;
                 padding: 12px; font-size: 1.1em; }
  .haut button.actif { background: #ffd400; color: #111; border-color: #ffd400; font-weight: bold; }
  #carte { position: absolute; top: 0; bottom: 60px; left: 0; right: 0; }
  #info { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; padding: 8px 12px;
          font-size: 0.9em; box-sizing: border-box; overflow: auto; }
  .etiquette { background: #ffd400; color: #111; font-weight: bold; border-radius: 8px;
               padding: 3px 7px; border: 2px solid #111; white-space: nowrap; font-size: 14px; }
</style>
</head>
<body>
<div class="haut" id="onglets"></div>
<div id="carte"></div>
<div id="info">Chargement…</div>

<script>
const CLE = "opendata-bordeaux-metropole-flux-gtfs-rt";
const BASE = "https://bdx.mecatran.com/utw/ws/siri/2.0/bordeaux/";
const NOMS = { "911": "H1" };

const ONGLETS = [
  { nom: "Aller", arrets: ["bordeaux:StopPoint:BP:2344:LOC", "bordeaux:StopPoint:BP:3310:LOC"],
    exclure: ["912"], sens9: "BRANDENBURG" },
  { nom: "Retour", arrets: ["bordeaux:StopPoint:BP:604:LOC", "bordeaux:StopPoint:BP:1959:LOC"],
    exclure: ["912"], sens9: "GARE ST JEAN" },
];

const val = x => Array.isArray(x) ? val(x[0]) : (x && typeof x === "object" && "value" in x) ? x.value : x;

// --- La carte (fond OpenStreetMap) ---
const carte = L.map("carte", { zoomControl: false }).setView([44.84, -0.58], 13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap"
}).addTo(carte);
const calqueBus = L.layerGroup().addTo(carte);
const calqueArrets = L.layerGroup().addTo(carte);

let choix = 0, coords = {}, premierCadrage = true;

function afficherOnglets() {
  document.getElementById("onglets").innerHTML = ONGLETS.map((o, i) =>
    `<button class="${i === choix ? "actif" : ""}" onclick="choisir(${i})">${o.nom}</button>`).join("");
}
function choisir(i) { choix = i; premierCadrage = true; afficherOnglets(); rafraichir(); }

// Position des arrêts (téléchargée une fois, puis gardée en mémoire)
async function chargerCoords() {
  try { coords = JSON.parse(localStorage.getItem("coordsArrets") || "{}"); } catch (e) {}
  const tous = ONGLETS.flatMap(o => o.arrets);
  if (tous.every(id => coords[id])) return;
  const data = await (await fetch(BASE + "stoppoints-discovery.json?AccountKey=" + CLE)).json();
  for (const a of data?.Siri?.StopPointsDelivery?.AnnotatedStopPointRef || []) {
    const id = val(a.StopPointRef);
    if (tous.includes(id) && a.Location) {
      coords[id] = [parseFloat(a.Location.Latitude), parseFloat(a.Location.Longitude)];
    }
  }
  try { localStorage.setItem("coordsArrets", JSON.stringify(coords)); } catch (e) {}
}

async function lireArret(ref) {
  const url = BASE + "stop-monitoring.json?AccountKey=" + CLE + "&MonitoringRef=" + encodeURIComponent(ref);
  const data = await (await fetch(url)).json();
  const liv = data?.Siri?.ServiceDelivery?.StopMonitoringDelivery;
  return (Array.isArray(liv) ? liv[0] : liv)?.MonitoredStopVisit || [];
}

async function rafraichir() {
  const o = ONGLETS[choix];
  const info = document.getElementById("info");
  try {
    // Arrêts en rond bleu
    calqueArrets.clearLayers();
    const points = [];
    o.arrets.forEach(id => {
      if (coords[id]) {
        L.circleMarker(coords[id], { radius: 9, color: "#fff", weight: 3, fillColor: "#1e6fff", fillOpacity: 1 })
          .addTo(calqueArrets);
        points.push(coords[id]);
      }
    });

    // Bus qui approchent
    const visites = (await Promise.all(o.arrets.map(lireArret))).flat();
    const maintenant = Date.now();
    calqueBus.clearLayers();
    let total = 0, localises = 0, exemple = null;
    const dejaVus = new Set();

    for (const v of visites) {
      const mvj = v.MonitoredVehicleJourney || {};
      const num = String(val(mvj.LineRef) || "").split(":")[2]?.replace(/^0+/, "") || "?";
      const ligne = NOMS[num] || num;
      const dest = val(mvj.DestinationName) || "";
      if (o.exclure.includes(num)) continue;
      if (num === "9" && !dest.toUpperCase().includes(o.sens9)) continue;
      total++;
      exemple = exemple || mvj;

      const pos = mvj.VehicleLocation;
      if (!pos || pos.Latitude == null) continue;
      const cle = val(mvj.VehicleRef) || (pos.Latitude + "," + pos.Longitude);
      if (dejaVus.has(cle)) continue;
      dejaVus.add(cle);
      localises++;

      const appel = mvj.MonitoredCall || {};
      const heure = appel.ExpectedArrivalTime || appel.AimedArrivalTime;
      const min = heure ? Math.max(0, Math.round((new Date(heure) - maintenant) / 60000)) : "?";
      const p = [parseFloat(pos.Latitude), parseFloat(pos.Longitude)];
      L.marker(p, { icon: L.divIcon({ className: "", html: `<span class="etiquette">${ligne} · ${min} min</span>` }) })
        .bindPopup(`${ligne} → ${dest}<br>à votre arrêt dans ${min} min`)
        .addTo(calqueBus);
      points.push(p);
    }

    if (premierCadrage && points.length) {
      carte.fitBounds(points, { padding: [60, 60], maxZoom: 16 });
      premierCadrage = false;
    }

    if (total > 0 && localises === 0) {
      info.innerHTML = `${total} bus trouvés, mais aucune position GPS dans ce flux.<br><small>Champs reçus : ${Object.keys(exemple).join(", ")}</small>`;
    } else {
      info.innerHTML = `${localises} bus sur la carte · mise à jour ${new Date().toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit", second: "2-digit"})}`;
    }
  } catch (e) {
    info.innerHTML = "Erreur : " + e.message;
  }
}

afficherOnglets();
chargerCoords().then(rafraichir);
setInterval(rafraichir, 20000);
</script>
</body>
</html>
