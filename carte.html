<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte bus</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/protobufjs/7.2.6/protobuf.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui; background: #111; color: #eee; }
  .haut { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000; display: flex; gap: 8px; }
  .haut button { flex: 1; background: #222; color: #eee; border: 2px solid #444; border-radius: 14px;
                 padding: 12px; font-size: 1.1em; }
  .haut button.actif { background: #ffd400; color: #111; border-color: #ffd400; font-weight: bold; }
  #carte { position: absolute; top: 0; bottom: 70px; left: 0; right: 0; }
  #info { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; padding: 8px 12px;
          font-size: 0.85em; box-sizing: border-box; overflow: auto; }
  .bus { background: #ffd400; color: #111; font-weight: bold; border-radius: 8px;
         padding: 3px 7px; border: 2px solid #111; white-space: nowrap; font-size: 14px; }
  .bus.sens1 { background: #ff8c1a; }
</style>
</head>
<body>
<div class="haut" id="onglets"></div>
<div id="carte"></div>
<div id="info">Chargement…</div>

<script>
const CLE = "opendata-bordeaux-metropole-flux-gtfs-rt";
const SIRI = "https://bdx.mecatran.com/utw/ws/siri/2.0/bordeaux/";
const POSITIONS = "https://bdx.mecatran.com/utw/ws/gtfsfeed/vehicles/bordeaux?apiKey=" + CLE;
const LIGNES = { "9": "9", "911": "H1" };   // numéro dans les données → nom affiché

const ONGLETS = [
  { nom: "Aller",  arrets: ["bordeaux:StopPoint:BP:2344:LOC", "bordeaux:StopPoint:BP:3310:LOC"] },
  { nom: "Retour", arrets: ["bordeaux:StopPoint:BP:604:LOC",  "bordeaux:StopPoint:BP:1959:LOC"] },
];

const val = x => Array.isArray(x) ? val(x[0]) : (x && typeof x === "object" && "value" in x) ? x.value : x;
const nb = x => parseFloat(val(x));
const valide = p => Number.isFinite(p[0]) && Number.isFinite(p[1]);

// --- Description du format binaire GTFS-RT (seulement les champs utiles) ---
const racine = protobuf.Root.fromJSON({ nested: {
  FeedMessage:      { fields: { entity:   { rule: "repeated", type: "FeedEntity", id: 2 } } },
  FeedEntity:       { fields: { id: { type: "string", id: 1 }, vehicle: { type: "VehiclePosition", id: 4 } } },
  VehiclePosition:  { fields: { trip: { type: "TripDescriptor", id: 1 }, position: { type: "Position", id: 2 },
                                vehicle: { type: "VehicleDescriptor", id: 8 } } },
  TripDescriptor:   { fields: { tripId: { type: "string", id: 1 }, routeId: { type: "string", id: 5 },
                                directionId: { type: "uint32", id: 6 } } },
  Position:         { fields: { latitude: { type: "float", id: 1 }, longitude: { type: "float", id: 2 } } },
  VehicleDescriptor:{ fields: { id: { type: "string", id: 1 }, label: { type: "string", id: 2 } } },
}});
const FeedMessage = racine.lookupType("FeedMessage");

// --- Carte ---
const carte = L.map("carte", { zoomControl: false }).setView([44.84, -0.58], 13);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(carte);
const calqueBus = L.layerGroup().addTo(carte);
const calqueArrets = L.layerGroup().addTo(carte);

const params = new URLSearchParams(location.search);
const LIGNE_CHOISIE = params.get("ligne");   // "9" ou "H1", reçu depuis la liste
let choix = Number(params.get("onglet")) || 0, coords = {}, cadrer = true;

function afficherOnglets() {
  document.getElementById("onglets").innerHTML =
    `<button style="flex:0 0 auto" onclick="location.href='index.html'">←</button>`
    + ONGLETS.map((o, i) =>
      `<button class="${i === choix ? "actif" : ""}" onclick="choisir(${i})">${o.nom}</button>`).join("");
}
function choisir(i) { choix = i; cadrer = true; afficherOnglets(); dessinerArrets(); }

async function chargerCoords() {
  try { coords = JSON.parse(localStorage.getItem("coordsArrets3") || "{}"); } catch (e) {}
  const tous = ONGLETS.flatMap(o => o.arrets);
  if (tous.every(id => coords[id])) return;
  const data = await (await fetch(SIRI + "stoppoints-discovery.json?AccountKey=" + CLE)).json();
  for (const a of data?.Siri?.StopPointsDelivery?.AnnotatedStopPointRef || []) {
    const id = val(a.StopPointRef);
    if (!tous.includes(id)) continue;
    const l = a.Location || {};
    const p = [nb(l.latitude ?? l.Latitude), nb(l.longitude ?? l.Longitude)];
    if (valide(p)) coords[id] = p;
  }
  try { localStorage.setItem("coordsArrets3", JSON.stringify(coords)); } catch (e) {}
}

function dessinerArrets() {
  calqueArrets.clearLayers();
  const pts = ONGLETS[choix].arrets.filter(id => coords[id]).map(id => coords[id]);
  pts.forEach(p => L.circleMarker(p, { radius: 9, color: "#fff", weight: 3, fillColor: "#1e6fff", fillOpacity: 1 })
    .bindPopup("Arrêt de maman").addTo(calqueArrets));
  if (cadrer && pts.length) { carte.setView(pts[0], 15); cadrer = false; }
}

async function rafraichirBus() {
  const info = document.getElementById("info");
  try {
    const rep = await fetch(POSITIONS);
    const flux = FeedMessage.decode(new Uint8Array(await rep.arrayBuffer()));
    calqueBus.clearLayers();
    const lignesVues = new Set();
    let n = 0;
    for (const e of flux.entity || []) {
      const v = e.vehicle;
      if (!v?.position) continue;
      const route = v.trip?.routeId || "";
      const num = ((route.match(/\d+/) || [""])[0]).replace(/^0+/, "");
      lignesVues.add(route);
      if (!(num in LIGNES)) continue;
      if (LIGNE_CHOISIE && LIGNES[num] !== LIGNE_CHOISIE) continue;
      const p = [v.position.latitude, v.position.longitude];
      if (!valide(p)) continue;
      n++;
      const sens = v.trip?.directionId || 0;
      L.marker(p, { icon: L.divIcon({ className: "", html: `<span class="bus sens${sens}">${LIGNES[num]}</span>` }) })
        .bindPopup(`Ligne ${LIGNES[num]} · sens ${sens}`)
        .addTo(calqueBus);
    }
    let msg = `${n} bus 9 / H1 sur la carte · ${new Date().toLocaleTimeString("fr-FR")}`;
    if (n === 0) msg += `<br><small>${(flux.entity || []).length} véhicules reçus. Exemples de lignes : ${[...lignesVues].slice(0, 12).join(", ") || "aucune"}</small>`;
    info.innerHTML = msg;
  } catch (e) {
    info.innerHTML = "Erreur positions : " + e.message;
  }
}

afficherOnglets();
chargerCoords().then(dessinerArrets);
rafraichirBus();
setInterval(rafraichirBus, 15000);
</script>
</body>
</html>
